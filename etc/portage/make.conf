# These settings were set by the catalyst build script that automatically
# built this stage.
# Please consult /usr/share/portage/config/make.conf.example for a more
# detailed example.

# CPU: 12th Gen Intel i5-12600KF (Alder Lake, 6P+4E, 16 threads)
COMMON_FLAGS="-march=native -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# 16 threads for parallel builds
MAKEOPTS="-j16"

# NOTE: This stage was built with the bindist USE flag enabled

# This sets the language of build output to English.
# Please keep this setting intact when reporting bugs.
LC_MESSAGES=C.UTF-8

# Portage parallel fetch

# Global USE flags
USE="-gnome -kde -qt6 wayland X elogind"

# Accept licenses
ACCEPT_LICENSE="*"

# Portage features
FEATURES="parallel-fetch parallel-install userfetch"

CPU_FLAGS_X86="aes avx avx2 avx_vnni bmi1 bmi2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 ssse3 vpclmulqdq"

# Binary package host (faster installation)

# Python transition: support both 3.13 and 3.14
PYTHON_TARGETS="python3_13 python3_14"
PYTHON_SINGLE_TARGET="python3_14"

# Use Chinese mirrors for distfiles (bypass DNS poisoning)
GENTOO_MIRRORS="https://mirrors.tuna.tsinghua.edu.cn/gentoo/ https://mirrors.ustc.edu.cn/gentoo/ http://mirrors.163.com/gentoo/"

# Rime Lua 插件 (app-i18n/librime-lua) 使用的 Lua 实现
LUA_SINGLE_TARGET="lua5-4"
